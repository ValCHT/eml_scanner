[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-email-triage"
version = "0.1.0"
description = "SOC Email Triage POC (V1.2) - squelette G0: configuration et contrats"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Baseline StateGraph runtime mandated by docs/architecture.md §1.2.
    "langgraph>=1.0.10,<2",
    "langgraph-checkpoint>=4.1.1,<5",
    # Parquet corpus manifest (docs/corpus.md §7.3), G6-only dependency.
    "pyarrow>=25.0,<26",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "PyYAML>=6.0,<7",
    "vt-py>=0.22,<0.23",
    "pycti>=7.260914,<8",
    "requests>=2.33,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]
rag = [
    # TICKET-15 (G7-A): local embedded Chroma + its ONNX all-MiniLM-L6-v2
    # embedding stack (onnxruntime/tokenizers pulled by chromadb itself).
    # Optional on purpose: the disabled baseline never imports it.
    "chromadb>=1.2,<2",
]

[tool.setuptools]
packages = ["src", "src.tools"]

[tool.pytest.ini_options]
markers = [
    "g0: gate G0 non-live tests",
    "g1: gate G1 non-live tests",
    "g2: gate G2 tests (live when combined with --live)",
    "g3: gate G3 non-live tests",
    "g4: gate G4 tests (live when combined with --live)",
    "g5: gate G5 tests (live when combined with --live)",
    "g6: gate G6 non-live tests",
    "g7a: gate G7-A tests",
    "g7b: gate G7-B tests",
    "live: tests calling real external services; run explicitly with --live",
]
addopts = "-m 'not live'"
